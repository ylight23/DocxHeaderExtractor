name: deterministic-contract

on:
  push:
    branches:
      - main
      - refactor/a99-semantic-control-plane-vnext
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  A99_FREEZE_UPDATE: '0'
  OPENROUTER_API_KEY: ''
  SGLANG_API_KEY: ''
  LMSTUDIO_API_KEY: ''

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve Windows paths and frozen bytes before checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Web tree projection and safe renderer
        run: node --test tests/web/pipeline-v2.test.cjs

      - name: Web pipeline V2 regression
        run: >-
          dotnet test tests/DocxHeaderExtractor.Tests/DocxHeaderExtractor.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~WebPipelineV2|FullyQualifiedName~MultipartOutlineGroundingTests|FullyQualifiedName~HeadingPlacementObservabilityTests|FullyQualifiedName~PdfP3bPlacementStageTests|FullyQualifiedName~WebPipelineResultViewTests|FullyQualifiedName~HostAuthorityE2ETests|FullyQualifiedName~HostProviderDiagnosticsTests|FullyQualifiedName~HeadingAuthorityByteParityTests|FullyQualifiedName~PdfFunctionConditionedHeadingAuthorityContractTests|FullyQualifiedName~PdfLiveExecutionLifecycleTests|FullyQualifiedName~ExtractionRoutingContractTests"

      - name: Focused authority and experiment contracts
        run: >-
          dotnet test tests/DocxHeaderExtractor.Tests/DocxHeaderExtractor.Tests.csproj
          -c Release --no-build
          --filter
          "FullyQualifiedName~PdfExperimentManifestTests|FullyQualifiedName~PdfGoldAuthorityTests|FullyQualifiedName~PdfGoldEvaluatorTests|FullyQualifiedName~PdfGoldOccurrenceAuthorityTests|FullyQualifiedName~PdfGoldReviewDecisionAuthorityTests|FullyQualifiedName~PdfGoldReviewPackTests|FullyQualifiedName~P4ReachabilityCleanupTests|FullyQualifiedName~V5OwnedDecisionProtocolV3Tests|FullyQualifiedName~V5RepresentabilityAuditTests|FullyQualifiedName~V5OwnedDecisionDisambiguationAuditTests"

      - name: Core deterministic Release suite
        run: >-
          pwsh -File scripts/Invoke-A99TestTier.ps1
          -Tier CoreDeterministic -Configuration Release -NoBuild

      - name: Generated-artifact cleanliness
        shell: bash
        run: |
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Working tree changed during deterministic CI; frozen artifacts must not be regenerated.'
            git status --short
            exit 1
          fi

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A99 source-first reviewer</title>
  <style>
    :root { color-scheme: light; font: 14px system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #18212b; }
    header { position: sticky; top: 0; z-index: 2; padding: 12px 18px; background: #17212b; color: white; }
    main { max-width: 1280px; margin: 0 auto; padding: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, input, select { font: inherit; }
    button { border: 1px solid #b8c2cc; border-radius: 4px; background: white; padding: 7px 10px; cursor: pointer; }
    button.primary { background: #1769aa; color: white; border-color: #1769aa; }
    input, select { border: 1px solid #b8c2cc; border-radius: 3px; padding: 5px; background: white; }
    .meta { margin: 8px 0; color: #52606d; }
    .row { display: grid; grid-template-columns: 42px minmax(260px, 1fr) 170px 230px 240px; gap: 8px; align-items: start; padding: 10px; margin: 8px 0; border: 1px solid #d8dee5; border-radius: 4px; background: white; }
    .row.current { outline: 2px solid #1769aa; }
    .row.done { border-left: 4px solid #2e8540; }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .facts { color: #52606d; font-size: 12px; line-height: 1.45; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .fields label { display: flex; flex-direction: column; gap: 2px; color: #52606d; font-size: 12px; }
    .fields .wide { grid-column: 1 / -1; }
    .hotkeys { font-size: 12px; color: #d8e2eb; }
    @media (max-width: 900px) { .row { grid-template-columns: 32px 1fr; } .facts, .fields { grid-column: 2; } }
  </style>
</head>
<body>
<header>
  <div class="toolbar">
    <input id="packetFile" type="file" accept="application/json,.json">
    <button id="save">Save progress</button>
    <button id="download" class="primary">Download HUMAN_GOLD</button>
    <span class="hotkeys">Keys: 1=YES, 2=NO, 3=UNSURE, J/K=next/previous</span>
  </div>
</header>
<main>
  <div id="meta" class="meta">Open one source-first packet. This page reads no model trace or prediction.</div>
  <div id="reviewer" class="toolbar" hidden>
    <label>Reviewer <input id="reviewerAlias" autocomplete="off"></label>
    <label>Version <input id="reviewVersion" value="a99-human-gold-v1" autocomplete="off"></label>
    <span id="progress"></span>
  </div>
  <div id="rows"></div>
</main>
<script>
(() => {
  'use strict';
  let packet = null;
  let state = {};
  let current = 0;
  const $ = id => document.getElementById(id);
  const key = () => packet ? `a99-review:${packet.documentId}:${packet.packetSha256}` : '';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rowState = id => state[id] || (state[id] = { label: 'UNSURE', role: '', start: '', end: '', level: '', parent: '' });
  function loadState() { try { state = JSON.parse(localStorage.getItem(key()) || '{}'); } catch (_) { state = {}; } }
  function persist() { if (packet) localStorage.setItem(key(), JSON.stringify(state)); renderProgress(); }
  function renderProgress() {
    if (!packet) return;
    const values = packet.occurrences.map(x => rowState(x.sourceId));
    const answered = values.filter(x => x.label === 'YES' || x.label === 'NO').length;
    $('progress').textContent = `${answered}/${values.length} explicit YES/NO; UNSURE remains visible and is excluded from official denominators.`;
  }
  function setLabel(id, label) {
    const s = rowState(id); s.label = label;
    if (label !== 'YES') { s.role = label === 'NO' ? 'body' : ''; s.start = ''; s.end = ''; s.level = ''; s.parent = ''; }
    render(); persist();
  }
  function move(delta) { if (!packet) return; current = Math.max(0, Math.min(packet.occurrences.length - 1, current + delta)); render(); document.querySelector('.row.current')?.scrollIntoView({block:'center'}); }
  function render() {
    if (!packet) return;
    $('reviewer').hidden = false;
    $('meta').textContent = `${packet.documentId} | ${packet.split} | ${packet.familyId} | ${packet.occurrences.length} source occurrences | ${packet.sourceDocumentSha256}`;
    $('rows').innerHTML = packet.occurrences.map((o, i) => {
      const s = rowState(o.sourceId); const done = s.label === 'YES' || s.label === 'NO';
      const roleOptions = s.label === 'YES' ? ['heading','title','caption','label','other'] : ['body','non-heading','other'];
      return `<article class="row ${i === current ? 'current' : ''} ${done ? 'done' : ''}" data-id="${esc(o.sourceId)}">
        <div>${i + 1}</div>
        <div><div class="text">${esc(o.sourceText) || '<em>(empty source occurrence)</em>'}</div><div class="facts">${esc(o.sourceId)} | ordinal ${o.sourceOrdinal}<br>style=${esc(o.style.styleName || o.style.styleId || '')}, num=${esc(o.numbering.numberingId)}, ilvl=${esc(o.numbering.ilvl)}, tableDepth=${o.layout.tableDepth}<br>prev=${esc(o.previousText)}<br>next=${esc(o.nextText)}</div></div>
        <div><button data-label="YES" data-id="${esc(o.sourceId)}">YES</button> <button data-label="NO" data-id="${esc(o.sourceId)}">NO</button> <button data-label="UNSURE" data-id="${esc(o.sourceId)}">UNSURE</button><div class="facts">current: ${esc(s.label)}</div></div>
        <div class="fields">
          <label>Role<select data-field="role" data-id="${esc(o.sourceId)}"><option value=""></option>${roleOptions.map(x => `<option ${s.role === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
          <label>Level<input data-field="level" data-id="${esc(o.sourceId)}" type="number" min="1" max="9" value="${esc(s.level)}"></label>
          <label>Span start<input data-field="start" data-id="${esc(o.sourceId)}" type="number" min="0" max="${o.sourceText.length}" value="${esc(s.start)}"></label>
          <label>Span end<input data-field="end" data-id="${esc(o.sourceId)}" type="number" min="0" max="${o.sourceText.length}" value="${esc(s.end)}"></label>
          <label class="wide">Parent source ID (ROOT, UNKNOWN, or an earlier YES occurrence)<input data-field="parent" data-id="${esc(o.sourceId)}" value="${esc(s.parent)}"></label>
        </div>
        <div class="facts">source span 0..${o.sourceText.length}<br>text sha ${esc(o.sourceTextHash)}</div>
      </article>`;
    }).join('');
    renderProgress();
  }
  function update(event) { const id = event.target.dataset.id; const field = event.target.dataset.field; if (!id || !field) return; rowState(id)[field] = event.target.value; persist(); }
  $('packetFile').addEventListener('change', async event => { const file = event.target.files[0]; if (!file) return; packet = JSON.parse(await file.text()); loadState(); current = 0; render(); });
  $('rows').addEventListener('click', event => { const button = event.target.closest('[data-label]'); if (button) setLabel(button.dataset.id, button.dataset.label); });
  $('rows').addEventListener('input', update); $('rows').addEventListener('change', update);
  document.addEventListener('keydown', event => { if (event.target.matches('input,select')) return; if (event.key === '1') setLabel(packet.occurrences[current].sourceId, 'YES'); else if (event.key === '2') setLabel(packet.occurrences[current].sourceId, 'NO'); else if (event.key === '3') setLabel(packet.occurrences[current].sourceId, 'UNSURE'); else if (event.key.toLowerCase() === 'j') move(1); else if (event.key.toLowerCase() === 'k') move(-1); });
  $('save').addEventListener('click', () => { persist(); $('meta').textContent += ' | progress saved locally'; });
  $('download').addEventListener('click', () => {
    if (!packet) return alert('Open a packet first.');
    const rows = packet.occurrences.map(o => { const s = rowState(o.sourceId); const yes = s.label === 'YES'; return { sourceId:o.sourceId, stableId:o.stableId, sourceOrdinal:o.sourceOrdinal, sourceSpan:o.sourceSpan, sourceTextHash:o.sourceTextHash, isHeading:s.label, role:s.role || null, headingSpan:yes && s.start !== '' && s.end !== '' ? {start:Number(s.start),end:Number(s.end)} : null, level:yes && s.level !== '' ? Number(s.level) : null, parentOccurrenceId:yes ? (s.parent || 'UNKNOWN') : null }; });
    const value = { artifactKind:'a99_human_gold', authorityClass:'HUMAN_GOLD', goldSchemaVersion:'a99-human-gold-v1', reviewerAlias:$('reviewerAlias').value, reviewedAt:new Date().toISOString(), reviewVersion:$('reviewVersion').value, independentOfModelPrediction:true, documentId:packet.documentId, documentGroupId:packet.documentGroupId, split:packet.split, sourceDocumentSha256:packet.sourceDocumentSha256, packetSha256:packet.packetSha256, rows };
    const blob = new Blob([JSON.stringify(value, null, 2) + '\n'], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${packet.documentId}.human-gold.json`; a.click(); URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
